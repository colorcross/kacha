name: macOS native smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install native media dependencies
        run: |
          brew install ffmpeg jq librsvg
          python3 -m venv "$RUNNER_TEMP/kacha-python"
          "$RUNNER_TEMP/kacha-python/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/kacha-python/bin/python" -m pip install Pillow fonttools
          echo "$RUNNER_TEMP/kacha-python/bin" >> "$GITHUB_PATH"

      - name: Run static and core checks
        run: |
          make check-static
          make check-core

      - name: Test installer without touching user skills
        run: bash tests/test_installer.sh
