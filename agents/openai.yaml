interface:
  display_name: "咔嚓"
  short_description: "确定性首剪/增量返工、视觉证据、自动 QC 与人工审片"
  default_prompt: "完整读取咔嚓 SKILL.md。较弱模型先用 prepare --model-tier economy 取得预算内 readOrder；已有项目运行 next 且一次只执行一个 nextAction。常见返工用 compile-change，不手写复杂 delta。Claude Code 涉及画面时先生成本地 visual-evidence；仅在外传、付费服务和显式命令均授权时用 MiniMax 分析少量关键帧。严格保持源只读、默认保持原几何、冻结层用流哈希证明，最终发布仍需当前版本完整 QC 和人工审片。"
